version: '3.8'

services:
  db:
    image: gouthamsindhu/flm-project:db
    deploy:
      replicas: 1
    ports:
      - "3306:3306"
    networks:
      - mynetwork

  auth_service:
    image: gouthamsindhu/flm-project:auth
    deploy:
      replicas: 1
    ports:
      - "5001:5001"
    networks:
      - mynetwork

  book_service:
    image: gouthamsindhu/flm-project:book
    deploy:
      replicas: 1
    ports:
      - "5002:5002"
    networks:
      - mynetwork

  borrow_service:
    image: gouthamsindhu/flm-project:borrow
    deploy:
      replicas: 1
    ports:
      - "5003:5003"
    networks:
      - mynetwork

  main_app:
    image: gouthamsindhu/flm-project:main-app
    deploy:
      replicas: 1
    ports:
      - "5000:5000"
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay
